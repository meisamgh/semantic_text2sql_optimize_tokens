[project]
name = "semantic-text2sql-optimize-tokens"
version = "0.6.0"
description = "Token-efficient hybrid-retrieval Text-to-SQL with deterministic grounding"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "fastembed>=0.7,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlglot>=27,<29",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = ["mypy>=1.15,<2", "pytest>=8.3,<9", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_text2sql"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["semantic_text2sql"]
